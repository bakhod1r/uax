version: "2"

run:
  timeout: 5m

linters:
  # Nothing runs that was not chosen. A default set changes under you between
  # releases, and a lint failure nobody asked for teaches people to ignore lint.
  default: none
  enable:
    - govet
    - staticcheck # subsumes gosimple and stylecheck since v2
    - ineffassign
    - unused
    - errcheck
    - misspell
    - bodyclose
    - errorlint
    - nilerr
    - copyloopvar
    - unconvert
    - usestdlibvars

  settings:
    errcheck:
      # Writing to an io.Writer the caller handed in. The CLI commands return
      # the error from their final write, and a failed Fprintf to a broken pipe
      # is reported there rather than at each line.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln

  exclusions:
    rules:
      # A test that ignores an error is asserting the call does not panic.
      # Requiring a check there adds noise without adding a guarantee.
      - path: _test\.go
        linters:
          - errcheck

formatters:
  enable:
    - gofmt

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
